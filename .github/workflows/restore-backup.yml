name: Restore Backup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync

      - name: Find ZIP file
        id: zip
        shell: bash
        run: |
          ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "*.zip" | head -n1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract backup
        shell: bash
        run: |
          rm -rf /tmp/jobforion_restore
          mkdir -p /tmp/jobforion_restore

          unzip -oq "${{ steps.zip.outputs.zip }}" -d /tmp/jobforion_restore

      - name: Detect project root
        id: root
        shell: bash
        run: |
          ROOT=$(find /tmp/jobforion_restore -mindepth 1 -maxdepth 1 -type d | head -n1)

          if [ -z "$ROOT" ]; then
            ROOT="/tmp/jobforion_restore"
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Restore files
        shell: bash
        run: |
          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            "${{ steps.root.outputs.root }}/" \
            "$GITHUB_WORKSPACE/"

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Restore backup"
          git push
