name: Restore Backup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip rsync

      - name: Restore Backup
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n1)

          mkdir temp

          unzip -q "$ZIP" -d temp

          ROOT=$(find temp -mindepth 1 -maxdepth 1 -type d | head -n1)

          rsync -a --delete \
            --exclude=".git" \
            --exclude=".github/workflows" \
            "$ROOT"/ ./

          rm -rf temp

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git diff --cached --quiet || git commit -m "Restore backup"

          git push
