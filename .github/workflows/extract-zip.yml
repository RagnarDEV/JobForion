name: Extract JobForion ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -e

          ZIP="JobForion-v2.1.0.zip"
          TEMP_DIR=".zip_extract"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP file not found: $ZIP"
            exit 1
          fi

          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"

          echo "Extracting $ZIP..."
          unzip -o "$ZIP" -d "$TEMP_DIR"

          echo "Detecting ZIP structure..."

          # إذا كان الملف يحتوي مجلدًا رئيسيًا واحدًا
          ITEMS=$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$ITEMS" -eq 1 ] && [ -d "$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1 -type d)" ]; then
            ROOT_DIR=$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1 -type d)

            echo "Single root folder detected: $ROOT_DIR"

            cp -a "$ROOT_DIR"/. ./
          else
            echo "Extracting files directly into repository..."
            cp -a "$TEMP_DIR"/. ./
          fi

          rm -rf "$TEMP_DIR"
          rm -f "$ZIP"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract JobForion v2.1.0"
          git push
