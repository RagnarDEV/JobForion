name: Extract JobForion ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract JobForion ZIP
        shell: bash
        run: |
          set -e

          echo "=== Repository files ==="
          ls -la

          ZIP=$(find . -maxdepth 1 -type f -name "JobForion-v*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: JobForion ZIP file was not found."
            exit 1
          fi

          echo "ZIP found: $ZIP"

          rm -rf .zip_extract
          mkdir -p .zip_extract

          echo "=== ZIP contents ==="
          unzip -l "$ZIP"

          echo "=== Extracting ==="
          unzip -o "$ZIP" -d .zip_extract

          echo "=== Extracted structure ==="
          find .zip_extract -maxdepth 2 -type f | head -100

          ROOT_COUNT=$(find .zip_extract -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$ROOT_COUNT" -eq 1 ]; then

            ROOT=$(find .zip_extract -mindepth 1 -maxdepth 1 -type d | head -n 1)

            if [ -n "$ROOT" ]; then
              echo "Single root directory detected:"
              echo "$ROOT"

              cp -a "$ROOT"/. ./
            else
              cp -a .zip_extract/. ./
            fi

          else
            cp -a .zip_extract/. ./
          fi

          rm -rf .zip_extract
          rm -f "$ZIP"

          echo "=== Final repository structure ==="
          ls -la

      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Extract JobForion v2.1.0"
          git push
